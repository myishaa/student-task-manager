services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: student_task_manager
      MYSQL_USER: task_manager
      MYSQL_PASSWORD: ${DB_PASSWORD:-task_manager_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u task_manager -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/student_task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: task_manager
      DB_PASSWORD: ${DB_PASSWORD:-task_manager_dev}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
