global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: student-task-manager-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["task-manager-api.student-task-manager.svc.cluster.local:8080"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.student-task-manager-monitoring.svc.cluster.local:8080"]
