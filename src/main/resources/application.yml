server:
  port: ${PORT:8080}

spring:
  application:
    name: student-task-manager
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_task_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:task_manager}
    password: ${DB_PASSWORD:task_manager_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: Student Task Manager API
    version: 0.1.0
