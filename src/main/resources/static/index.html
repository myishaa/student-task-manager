<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Studyspace · Student Task Manager</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2925;
      --muted: #78817c;
      --line: #e6e9e4;
      --paper: #fff;
      --canvas: #f6f7f4;
      --green: #28745b;
      --green-dark: #205d49;
      --green-soft: #e9f3ed;
      --amber: #a76a18;
      --amber-soft: #fbf2df;
      --red: #b34a43;
      --red-soft: #faece9;
      --shadow: 0 14px 38px rgba(32, 49, 40, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar { height: 76px; background: var(--paper); border-bottom: 1px solid var(--line); display: flex; align-items: center; }
    .topbar-inner, main { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -.035em; font-size: 19px; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--green); color: white; font-size: 18px; }
    .brand small { display: block; color: var(--muted); letter-spacing: 0; font-size: 11px; font-weight: 550; margin-top: -2px; }
    .top-actions { display: flex; align-items: center; gap: 15px; }
    .demo-link { color: var(--green); text-decoration: none; font-size: 12px; font-weight: 720; padding: 7px 10px; border-radius: 8px; background: var(--green-soft); }
    .demo-link:hover { background: #dcece3; }
    .connection { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4e9c73; box-shadow: 0 0 0 3px #e9f3ed; }
    main { padding: 44px 0 64px; }
    .welcome { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-size: clamp(30px, 4vw, 40px); letter-spacing: -.055em; line-height: 1.1; margin: 0; }
    .subhead { color: var(--muted); margin: 10px 0 0; }
    .primary { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 0 17px; border: 0; border-radius: 10px; background: var(--green); color: #fff; font-weight: 680; box-shadow: 0 4px 10px rgba(40, 116, 91, .14); transition: .18s ease; }
    .primary:hover { background: var(--green-dark); transform: translateY(-1px); }
    .primary .plus { font-size: 21px; font-weight: 400; line-height: 1; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 25px; }
    .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 13px; padding: 17px 19px; display: flex; align-items: center; justify-content: space-between; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat-number { font-size: 25px; font-weight: 730; letter-spacing: -.04em; }
    .stat-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 16px; }
    .stat:nth-child(2) .stat-icon { background: var(--amber-soft); color: var(--amber); }
    .stat:nth-child(3) .stat-icon { background: #edf0fa; color: #596aab; }
    .board { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
    .board-head { padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .board-title { font-size: 16px; font-weight: 720; letter-spacing: -.02em; }
    .count { color: var(--muted); font-size: 12px; font-weight: 500; margin-left: 7px; }
    .filters { display: flex; gap: 4px; padding: 17px 22px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .filter { position: relative; background: transparent; color: var(--muted); border: 0; padding: 0 12px 13px; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .filter:first-child { padding-left: 0; }
    .filter.active { color: var(--green); }
    .filter.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--green); border-radius: 2px; }
    .task-list { padding: 3px 22px 8px; }
    .task { display: grid; grid-template-columns: 34px minmax(0, 1fr) 122px 110px 72px; align-items: center; gap: 14px; min-height: 82px; border-bottom: 1px solid #eef0ed; }
    .task:last-child { border-bottom: 0; }
    .check-wrap { position: relative; display: block; width: 21px; height: 21px; margin: auto; }
    .check { position: absolute; inset: 0; z-index: 1; width: 21px; height: 21px; margin: 0; opacity: 0; cursor: pointer; }
    .checkmark { position: absolute; inset: 0; border: 1.5px solid #c9d0ca; border-radius: 7px; transition: .15s; pointer-events: none; }
    .check:hover + .checkmark { border-color: var(--green); }
    .check:focus-visible + .checkmark { outline: 3px solid rgba(40, 116, 91, .25); outline-offset: 2px; }
    .check:checked + .checkmark { border-color: var(--green); background: var(--green); }
    .check:checked + .checkmark::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .task-title { font-weight: 660; letter-spacing: -.015em; overflow-wrap: anywhere; }
    .task-description { color: var(--muted); font-size: 12px; margin-top: 3px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 520px; }
    .task-due { color: var(--muted); font-size: 12px; }
    .task-due.overdue { color: var(--red); font-weight: 650; }
    .badge { justify-self: start; padding: 5px 9px; border-radius: 999px; background: #f1f3f0; color: #59645e; font-size: 10px; font-weight: 750; letter-spacing: .035em; }
    .badge.high { background: var(--red-soft); color: var(--red); }
    .badge.medium { background: var(--amber-soft); color: var(--amber); }
    .badge.low { background: var(--green-soft); color: var(--green); }
    .actions { display: flex; justify-content: flex-end; gap: 3px; }
    .icon-button { border: 0; background: transparent; color: #89918c; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; font-size: 15px; }
    .icon-button:hover { color: var(--green); background: var(--green-soft); }
    .icon-button.delete:hover { color: var(--red); background: var(--red-soft); }
    .empty { text-align: center; padding: 54px 20px 62px; }
    .empty-icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; margin: 0 auto 14px; color: var(--green); background: var(--green-soft); font-size: 23px; }
    .empty h2 { font-size: 16px; margin: 0; letter-spacing: -.02em; }
    .empty p { color: var(--muted); margin: 6px auto 18px; font-size: 13px; }
    .secondary { background: white; color: var(--ink); border: 1px solid var(--line); border-radius: 9px; min-height: 38px; padding: 0 13px; font-weight: 620; }
    .secondary:hover { border-color: #c8d7cd; background: #fafcf9; }
    .loading, .error-state { text-align: center; padding: 46px 16px; color: var(--muted); }
    .error-state { color: var(--red); }
    dialog { width: min(480px, calc(100% - 32px)); border: 1px solid var(--line); padding: 0; border-radius: 17px; box-shadow: 0 24px 80px rgba(26, 39, 32, .2); color: var(--ink); }
    dialog::backdrop { background: rgba(27, 39, 33, .35); backdrop-filter: blur(3px); }
    .dialog-head { padding: 22px 24px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; }
    .dialog-head h2 { font-size: 20px; letter-spacing: -.035em; margin: 0; }
    .dialog-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .close { border: 0; background: transparent; color: var(--muted); font-size: 21px; line-height: 1; padding: 2px 5px; }
    form { padding: 20px 24px 23px; }
    .field { margin-bottom: 15px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    label { display: block; font-size: 12px; font-weight: 650; margin: 0 0 6px; }
    input, textarea, select { width: 100%; border: 1px solid #dfe4df; background: #fff; color: var(--ink); border-radius: 9px; padding: 10px 11px; outline: none; transition: .15s; }
    input, select { height: 42px; }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: #79a993; box-shadow: 0 0 0 3px rgba(40, 116, 91, .1); }
    .form-error { display: none; color: var(--red); background: var(--red-soft); padding: 9px 11px; border-radius: 8px; font-size: 12px; margin-bottom: 13px; }
    .form-footer { display: flex; justify-content: flex-end; gap: 9px; padding-top: 4px; }
    .toast { position: fixed; left: 50%; bottom: 25px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #263630; color: #fff; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; transition: .2s; z-index: 5; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 700px) {
      .topbar { height: 66px; }
      .topbar-inner, main { width: min(100% - 30px, 560px); }
      .connection { display: none; }
      main { padding-top: 31px; }
      .welcome { align-items: flex-start; flex-direction: column; margin-bottom: 20px; }
      .welcome .primary { width: 100%; }
      .stats { gap: 8px; }
      .stat { padding: 12px 11px; align-items: flex-start; flex-direction: column-reverse; gap: 5px; }
      .stat-number { font-size: 22px; }
      .stat-icon { width: 29px; height: 29px; border-radius: 9px; }
      .board-head { padding: 17px 16px 0; }
      .filters { padding-left: 16px; padding-right: 16px; }
      .task-list { padding: 0 16px; }
      .task { grid-template-columns: 28px minmax(0, 1fr) 72px; gap: 9px; padding: 12px 0; min-height: 75px; }
      .task-due { display: none; }
      .badge { grid-column: 2; grid-row: 2; margin-top: -8px; }
      .actions { grid-column: 3; grid-row: 1 / span 2; }
      .task-copy { grid-column: 2; }
      .task-description { max-width: calc(100vw - 150px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>studyspace<small>Student task manager</small></span></div>
        <div class="top-actions"><a class="demo-link" href="/demo.html">Demo console</a><div class="connection"><span class="dot" aria-hidden="true"></span><span>Connected to your task list</span></div></div>
      </div>
    </header>
    <main>
      <section class="welcome" aria-labelledby="welcome-title">
        <div><p class="eyebrow">Your study planner</p><h1 id="welcome-title">Make room to focus.</h1><p class="subhead">A little progress adds up. What are you working on?</p></div>
        <button class="primary" id="new-task" type="button"><span class="plus" aria-hidden="true">+</span> Add a task</button>
      </section>
      <section class="stats" aria-label="Task summary">
        <article class="stat"><div><div class="stat-label">All tasks</div><div class="stat-number" id="all-count">—</div></div><span class="stat-icon" aria-hidden="true">▤</span></article>
        <article class="stat"><div><div class="stat-label">In progress</div><div class="stat-number" id="progress-count">—</div></div><span class="stat-icon" aria-hidden="true">◷</span></article>
        <article class="stat"><div><div class="stat-label">Completed</div><div class="stat-number" id="done-count">—</div></div><span class="stat-icon" aria-hidden="true">✓</span></article>
      </section>
      <section class="board" aria-label="Your tasks">
        <div class="board-head"><div class="board-title">My tasks <span class="count" id="visible-count"></span></div></div>
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter active" data-filter="ALL" type="button">All tasks</button>
          <button class="filter" data-filter="TODO" type="button">To do</button>
          <button class="filter" data-filter="IN_PROGRESS" type="button">In progress</button>
          <button class="filter" data-filter="DONE" type="button">Completed</button>
        </nav>
        <div class="task-list" id="task-list" aria-live="polite"><div class="loading">Loading your tasks…</div></div>
      </section>
    </main>
  </div>
  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><div><h2 id="dialog-title">Add a task</h2><p>Give your next step a name.</p></div><button class="close" type="button" aria-label="Close">×</button></div>
    <form id="task-form">
      <div class="field"><label for="title">Task name <span aria-hidden="true">*</span></label><input id="title" name="title" maxlength="160" required placeholder="e.g. Review cloud computing notes"></div>
      <div class="field"><label for="description">Notes <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="description" name="description" maxlength="2000" placeholder="Add a little more detail…"></textarea></div>
      <div class="field-row">
        <div class="field"><label for="due-date">Due date <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="due-date" name="dueDate" type="date"></div>
        <div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="LOW">Low</option></select></div>
      </div>
      <div class="field"><label for="status">Status</label><select id="status" name="status"><option value="TODO">To do</option><option value="IN_PROGRESS">In progress</option><option value="DONE">Completed</option></select></div>
      <div class="form-error" id="form-error" role="alert"></div>
      <div class="form-footer"><button class="secondary" id="cancel" type="button">Cancel</button><button class="primary" id="save" type="submit">Add task</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const API = '/api/tasks';
      const list = document.querySelector('#task-list');
      const dialog = document.querySelector('#task-dialog');
      const form = document.querySelector('#task-form');
      const errorBox = document.querySelector('#form-error');
      const labels = { TODO: 'To do', IN_PROGRESS: 'In progress', DONE: 'Completed' };
      let tasks = [];
      let filter = 'ALL';
      let editingId = null;
      let toastTimer;

      async function request(path = '', options = {}) {
        const response = await fetch(`${API}${path}`, {
          ...options,
          headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers }
        });
        if (!response.ok) {
          let detail = '';
          try { const body = await response.json(); detail = body.detail || body.message || body.error || ''; } catch (_) {}
          throw new Error(detail || `Request failed (${response.status})`);
        }
        return response.status === 204 ? null : response.json();
      }

      function escapeHtml(value = '') {
        return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
      }

      function formatDate(value) {
        if (!value) return '';
        const date = new Date(`${value}T00:00:00`);
        return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' }).format(date);
      }

      function render() {
        const completed = tasks.filter(task => task.status === 'DONE').length;
        document.querySelector('#all-count').textContent = tasks.length;
        document.querySelector('#progress-count').textContent = tasks.filter(task => task.status === 'IN_PROGRESS').length;
        document.querySelector('#done-count').textContent = completed;
        const shown = filter === 'ALL' ? tasks : tasks.filter(task => task.status === filter);
        document.querySelector('#visible-count').textContent = `${shown.length} ${shown.length === 1 ? 'task' : 'tasks'}`;
        if (!shown.length) {
          const filtered = filter !== 'ALL';
          list.innerHTML = `<div class="empty"><div class="empty-icon" aria-hidden="true">${filtered ? '⌕' : '✳'}</div><h2>${filtered ? `No ${labels[filter].toLowerCase()} tasks` : 'A fresh start.'}</h2><p>${filtered ? 'Try a different filter to see more tasks.' : 'Add your first task and make a plan for today.'}</p>${filtered ? '' : '<button class="secondary" type="button" data-add-first>Add your first task</button>'}</div>`;
          return;
        }
        list.innerHTML = shown.map(task => {
          const checked = task.status === 'DONE';
          const due = task.dueDate ? formatDate(task.dueDate) : '';
          const overdue = due && task.dueDate < new Date().toLocaleDateString('en-CA') && !checked;
          const description = task.description ? `<div class="task-description">${escapeHtml(task.description)}</div>` : '';
          return `<article class="task" data-task-id="${task.id}">
            <label class="check-wrap"><input class="check" type="checkbox" ${checked ? 'checked' : ''} aria-label="Mark ${escapeHtml(task.title)} ${checked ? 'not completed' : 'completed'}"><span class="checkmark" aria-hidden="true"></span></label>
            <div class="task-copy"><div class="task-title" ${checked ? 'style="color:var(--muted);text-decoration:line-through"' : ''}>${escapeHtml(task.title)}</div>${description}</div>
            <div class="task-due ${overdue ? 'overdue' : ''}">${due ? `${overdue ? 'Overdue · ' : ''}${escapeHtml(due)}` : ''}</div>
            <span class="badge ${String(task.priority || 'MEDIUM').toLowerCase()}">${escapeHtml(task.priority || 'MEDIUM')}</span>
            <div class="actions"><button class="icon-button edit" type="button" aria-label="Edit ${escapeHtml(task.title)}" title="Edit">✎</button><button class="icon-button delete" type="button" aria-label="Delete ${escapeHtml(task.title)}" title="Delete">⌫</button></div>
          </article>`;
        }).join('');
      }

      async function load() {
        list.innerHTML = '<div class="loading">Loading your tasks…</div>';
        try {
          tasks = await request();
          tasks.sort((a, b) => Number(a.status === 'DONE') - Number(b.status === 'DONE') || (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || a.id - b.id);
          render();
        } catch (error) {
          list.innerHTML = `<div class="error-state">Could not load tasks. ${escapeHtml(error.message)}<br><button class="secondary" type="button" data-retry style="margin-top:12px">Try again</button></div>`;
        }
      }

      function notify(message) {
        const toast = document.querySelector('#toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
      }

      function openForm(task = null) {
        editingId = task?.id ?? null;
        form.reset();
        errorBox.style.display = 'none';
        document.querySelector('#dialog-title').textContent = task ? 'Edit task' : 'Add a task';
        document.querySelector('.dialog-head p').textContent = task ? 'Update the details for this task.' : 'Give your next step a name.';
        document.querySelector('#save').textContent = task ? 'Save changes' : 'Add task';
        if (task) {
          form.elements.title.value = task.title || '';
          form.elements.description.value = task.description || '';
          form.elements.dueDate.value = task.dueDate || '';
          form.elements.priority.value = task.priority || 'MEDIUM';
          form.elements.status.value = task.status || 'TODO';
        }
        dialog.showModal();
        document.querySelector('#title').focus();
      }

      document.querySelector('#new-task').addEventListener('click', () => openForm());
      document.querySelector('.close').addEventListener('click', () => dialog.close());
      document.querySelector('#cancel').addEventListener('click', () => dialog.close());
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
      document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
        filter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        render();
      }));

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const data = new FormData(form);
        const body = {
          title: data.get('title').trim(),
          description: data.get('description').trim() || null,
          dueDate: data.get('dueDate') || null,
          priority: data.get('priority'),
          status: data.get('status')
        };
        const save = document.querySelector('#save');
        save.disabled = true;
        save.textContent = 'Saving…';
        errorBox.style.display = 'none';
        try {
          await request(editingId ? `/${editingId}` : '', { method: editingId ? 'PUT' : 'POST', body: JSON.stringify(body) });
          dialog.close();
          notify(editingId ? 'Task updated' : 'Task added');
          await load();
        } catch (error) {
          errorBox.textContent = error.message;
          errorBox.style.display = 'block';
        } finally {
          save.disabled = false;
          save.textContent = editingId ? 'Save changes' : 'Add task';
        }
      });

      list.addEventListener('click', async event => {
        if (event.target.closest('[data-retry]')) return load();
        if (event.target.closest('[data-add-first]')) return openForm();
        const card = event.target.closest('[data-task-id]');
        if (!card) return;
        const task = tasks.find(item => String(item.id) === card.dataset.taskId);
        if (event.target.closest('.edit')) return openForm(task);
        if (event.target.closest('.delete')) {
          if (!window.confirm(`Delete “${task.title}”? This cannot be undone.`)) return;
          try { await request(`/${task.id}`, { method: 'DELETE' }); notify('Task deleted'); await load(); }
          catch (error) { notify(`Could not delete task: ${error.message}`); }
        }
      });

      list.addEventListener('change', async event => {
        if (!event.target.matches('.check')) return;
        const card = event.target.closest('[data-task-id]');
        const task = tasks.find(item => String(item.id) === card.dataset.taskId);
        const status = event.target.checked ? 'DONE' : 'TODO';
        event.target.disabled = true;
        try { await request(`/${task.id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) }); notify(status === 'DONE' ? 'Task completed' : 'Task reopened'); await load(); }
        catch (error) { event.target.checked = !event.target.checked; event.target.disabled = false; notify(`Could not update task: ${error.message}`); }
      });

      load();
    })();
  </script>
</body>
</html>
