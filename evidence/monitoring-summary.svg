<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Recorded Prometheus monitoring snapshot</title>
  <desc id="desc">Six static cards summarize recorded request rate, server errors, latency, ready replicas, JVM heap, and Spring Boot process CPU. This is not a Grafana screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#17283a"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#72e0c5"/><stop offset="1" stop-color="#5ca6ff"/></linearGradient>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="64" y="65" fill="#eef5ff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Student Task Manager · Monitoring evidence</text>
  <text x="64" y="101" fill="#a8bdd2" font-family="Arial,sans-serif" font-size="16">Recorded 25 Oct 2026 · Prometheus query results · Sydney single-node demo</text>
  <rect x="64" y="122" width="1072" height="2" fill="#38516e"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(64 148)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">API request rate</text>
      <text x="20" y="100" fill="url(#accent)" font-size="34" font-weight="700">0.3719 req/s</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">5-minute rate</text>
    </g>
    <g transform="translate(432 148)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">5xx response rate</text>
      <text x="20" y="100" fill="#72e0c5" font-size="34" font-weight="700">0</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">No errors in sample</text>
    </g>
    <g transform="translate(800 148)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">Mean API duration</text>
      <text x="20" y="100" fill="url(#accent)" font-size="34" font-weight="700">8.93 ms</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">5-minute histogram mean</text>
    </g>
    <g transform="translate(64 355)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">Ready API replicas</text>
      <text x="20" y="100" fill="url(#accent)" font-size="34" font-weight="700">1 / 1</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">Ready / desired</text>
    </g>
    <g transform="translate(432 355)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">JVM heap used</text>
      <text x="20" y="100" fill="url(#accent)" font-size="34" font-weight="700">49.9 MB</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">Recorded 49,917,728 bytes</text>
    </g>
    <g transform="translate(800 355)">
      <rect width="336" height="180" rx="17" fill="#1d3044" stroke="#35516e"/>
      <text x="20" y="38" fill="#b5c8da" font-size="16">Spring Boot process CPU</text>
      <text x="20" y="100" fill="url(#accent)" font-size="34" font-weight="700">2.9%</text>
      <text x="20" y="146" fill="#93a9bf" font-size="13">About 0.0293 of one core</text>
    </g>
  </g>
  <text x="64" y="596" fill="#a8bdd2" font-family="Arial,sans-serif" font-size="14">Static evidence graphic reconstructed from recorded Prometheus values; it is not a live dashboard export.</text>
</svg>
